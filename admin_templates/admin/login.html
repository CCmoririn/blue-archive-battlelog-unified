{% extends 'admin/base.html' %}{% block content %}<section class="card login"><div class="eyebrow">ADMINISTRATION</div><h1>管理画面にログイン</h1><p class="muted">キャラ情報とシーズンの設定を管理します。</p>
{% if unavailable %}<div class="notice error">管理画面のログイン設定を確認してください。</div>{% else %}
{% if error %}<div class="notice error" role="alert">{{ error }}</div>{% endif %}
<form method="post"><input type="hidden" name="csrf" value="{{ csrf_token() }}"><label>管理用パスワード<input type="password" name="password" autocomplete="current-password" required maxlength="256" autofocus></label><button class="primary wide">ログイン</button></form>{% endif %}</section>{% endblock %}
