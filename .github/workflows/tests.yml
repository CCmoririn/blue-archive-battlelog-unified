name: Offline regression tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      BATTLELOG_SKIP_DOTENV: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install Flask==2.3.2 Werkzeug==2.3.8 requests==2.31.0 gspread==5.11.2 python-dotenv==1.0.1 google-auth==2.23.3 numpy==1.25.2
      - run: python -B -m unittest discover -s tests -v
      - run: node tests/test_frontend.js
      - run: node tests/test_admin_frontend.js
